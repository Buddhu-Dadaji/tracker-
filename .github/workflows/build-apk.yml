name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember the signing key
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-key-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        run: yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: tracker-apk
          path: app/build/outputs/apk/release/*.apk
